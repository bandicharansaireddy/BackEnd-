spring:
  datasource:
    url: jdbc:mysql://localhost:3306/freshmart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
app:
  cors:
    allowed-origin: http://localhost:5173
  jwt:
    # Generate locally with: openssl rand -base64 48
    secret: ${JWT_SECRET}
    refresh-secure: false
